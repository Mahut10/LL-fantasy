<style>
@font-face{font-family:'Sofia Pro';src:url('./assets/fonts/Sofia%20Pro%20Regular.otf') format('opentype');font-style:normal;font-weight:400;font-display:swap}
:root{--green:#07583d;--green2:#0b6949;--mint:#4bb99b;--ink:#101513;--muted:#68736e;--line:#dfe6e2;--bg:#f3f5f3;--white:#fff;--red:#a52828;--font:'Sofia Pro',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}button,input{font:inherit}button{cursor:pointer}

.user-area{margin-left:auto;display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;min-width:38px;aspect-ratio:1/1;background:#fff;color:var(--green);display:grid;place-items:center;border-radius:50%;font-weight:700;overflow:hidden}.avatar img,.profile-avatar img{width:100%;height:100%;display:block;object-fit:cover}.profile-avatar{width:65px;height:65px;min-width:65px;aspect-ratio:1/1;background:#fff;color:var(--green);display:grid;place-items:center;font-size:25px;font-weight:700;border-radius:50%;overflow:hidden}.user-name{font-size:14px}.logout{border:1px solid #80a99b;background:transparent;color:#fff;padding:8px 12px}
.page{max-width:1180px;margin:0 auto;padding:36px 22px 70px}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--green2);font-family:var(--font);font-size:17px;text-transform:uppercase;font-weight:700;letter-spacing:.08em}.page h1{font-size:46px;line-height:1;margin:4px 0 0;font-weight:700}.page-intro{color:var(--muted);margin:8px 0 0;max-width:650px}.selection-rules{margin:14px 0 0;padding:13px 16px;border-left:5px solid var(--green);background:#e7eeea;color:var(--ink);font-size:16px;font-weight:600;line-height:1.4}.star-mark{color:var(--green);font-family:Arial,sans-serif;font-size:1em;font-weight:700;display:inline-block;line-height:1}
.btn{border:0;padding:11px 17px;font-size:18px;font-weight:600}.btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--green2)}.btn.secondary{background:#e7eeea;color:var(--green)}.btn.white{background:#fff;color:var(--green)}
.card{background:#fff;border:1px solid var(--line);padding:22px}.grid{display:grid;gap:14px}.grid.classes{grid-template-columns:repeat(2,minmax(0,1fr))}.class-card{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:20px 24px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--green)}.class-card>div{display:flex;flex-direction:column;align-items:flex-start}.class-card:hover{border-color:#aebdb6}.class-name{font-size:27px;font-weight:700;line-height:1.1}.class-distance{color:var(--muted);font-size:15px;line-height:1.25;margin-top:5px}.arrow{font-size:25px;color:var(--green)}
.login-wrap{min-height:100vh;background:linear-gradient(#f4f6f4,#eaf0ed);display:grid;place-items:center;padding:25px}.login-box{width:min(460px,100%);background:#fff;border:1px solid var(--line);padding:36px 36px 30px;box-shadow:0 14px 45px rgba(16,35,28,.09)}.login-logo{display:block;width:300px;max-width:90%;height:auto;margin:0 auto 28px}.login-title{font-family:var(--font);font-size:36px;text-align:center;margin:0 0 4px}.login-sub{text-align:center;color:var(--muted);margin:0 0 25px}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;border:1px solid #cfd8d3;padding:12px 13px;background:#fbfcfb;outline:none}.field input:focus{border-color:var(--green)}.login-actions{display:flex;gap:10px;margin-top:18px}.login-actions>*{flex:1}.login-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}.error{color:var(--red);font-size:13px;margin:8px 0}
.profile-strip{background:var(--green);color:#fff;padding:25px 27px;display:flex;align-items:center;gap:18px;margin-bottom:18px}.profile-avatar{width:65px;height:65px;background:#fff;color:var(--green);display:grid;place-items:center;font-size:25px;font-weight:700;border-radius:50%}.profile-strip h2{font-size:32px;margin:0}.profile-strip p{margin:2px 0 0;color:#d5e7df}.stat{margin-left:auto;text-align:right}.big-number{font-size:36px;font-weight:700}.stat small{color:#d5e7df}
.section-title{font-family:var(--font);font-size:30px;margin:28px 0 12px}.overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.overview-card{background:#fff;border:1px solid var(--line);padding:17px}.overview-head{display:flex;justify-content:space-between;border-bottom:1px solid #edf1ef;padding-bottom:9px;margin-bottom:5px}.overview-head strong{font-family:var(--font);font-size:21px;color:var(--green)}.overview-head span{color:var(--muted);font-size:13px;font-weight:600}.overview-labels{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:3px 0 2px}.overview-labels span:last-child{text-align:right}.runner-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f1}.runner-row:last-child{border:0}.runner-name{font-weight:600}.runner-club{font-size:12px;color:var(--muted);margin-top:2px}.stars{color:var(--green);font-weight:700;white-space:nowrap}.star-cost{display:flex;align-items:center;gap:4px;min-width:46px;justify-content:flex-end}.star-cost .star-mark{font-size:17px}.star-cost-number{font-size:14px;color:var(--green);font-weight:700}
.friend-layout,.league-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.list{background:#fff;border:1px solid var(--line)}.list-item{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid #edf0ee}.list-item:last-child{border:0}.mini-avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#dfeae5;color:var(--green);font-weight:700}.list-main{flex:1}.list-name{font-weight:700}.list-meta{font-size:12px;color:var(--muted);margin-top:2px}.right-actions{margin-left:auto}.empty{padding:28px;color:var(--muted);text-align:center}
.league-card{background:#fff;border:1px solid var(--line);padding:20px}.league-card + .league-card{margin-top:12px}.league-card-head{display:flex;justify-content:space-between;align-items:start}.league-card h3{font-size:28px;margin:0}.league-code{font-family:monospace;background:#edf3f0;color:var(--green);padding:5px 8px;font-size:12px}.league-members{color:var(--muted);font-size:13px;margin:7px 0 14px}.member-stack{display:flex;align-items:center}.member-stack .mini-avatar{margin-right:-8px;border:2px solid #fff;width:34px;height:34px;font-size:11px}.modal-backdrop{position:fixed;inset:0;background:rgba(7,24,17,.58);z-index:50;display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);background:#fff;padding:27px}.modal h2{font-size:34px;margin:0 0 17px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:13px 17px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.site-footer{margin-top:42px;padding:20px 0 4px;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:12px;text-align:center}
.site-footer button{border:0;background:none;color:var(--green);padding:0;text-decoration:underline;font-size:12px}
.terms-page{max-width:820px}.terms-page h2{font-size:25px;margin:28px 0 8px;color:var(--green)}.terms-page p{line-height:1.55;color:#39433f}.terms-page ul{line-height:1.55;color:#39433f;padding-left:22px}
@media(max-width:800px){.topbar{padding:0 14px;height:auto;min-height:64px;flex-wrap:wrap;gap:5px}.top-logo{height:40px}.nav{order:3;width:100%;height:45px;overflow:auto}.nav button{font-size:17px;padding:0 10px}.nav button.active:after{left:10px;right:10px}.user-name,.logout{display:none}.page{padding:25px 14px 50px}.page h1{font-size:39px}.page-head{align-items:start}.grid.classes,.overview-grid,.friend-layout,.league-layout{grid-template-columns:1fr}.profile-strip{align-items:flex-start}.stat{margin-left:auto}.big-number{font-size:30px}}
</style>

<style id="ll-branding">
:root { --ll-green:#17613f; --ll-green-dark:#10472e; }
a, a:visited { color:var(--ll-green) !important; }
.class-card, .class-card:visited, .class-card:hover { color:var(--green) !important; }

  border-color:var(--ll-green) !important;
  color:#fff !important;
}
.ll-logo {
  display:block;

  margin:0 auto 22px;

<style id="runner-controls">

.runner-sort{
  border:1px solid #cfd8d3;
  padding:11px 13px;
  background:#fff;
  color:var(--ink);
  min-width:190px;
}
.runner-count{
  width:100%;
  color:var(--muted);
  font-size:13px;
  margin-top:-2px;
}
.runner-result.is-hidden{display:none}.my-runners-mobile-note{display:none}
.info-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}.info-actions .btn{font-size:15px}
.info-page{max-width:860px}.info-page h2{font-size:26px;margin:28px 0 8px;color:var(--green)}.info-page p{line-height:1.55;color:#39433f}.info-page ul{line-height:1.55;color:#39433f;padding-left:22px}.info-note{background:#e7eeea;border-left:4px solid var(--green);padding:13px 15px;margin:16px 0;color:var(--ink);line-height:1.5}

@media(max-width:800px){

  .my-page-head .page-intro{font-size:15px}
  .my-runners-mobile-note{display:block;color:var(--muted);font-size:13px;margin:-4px 0 12px}
  .profile-strip{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:18px 16px;margin-bottom:14px}

  .profile-strip h2{font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .overview-grid{grid-template-columns:1fr;gap:10px}
  .overview-card{padding:14px 15px}

<style id="profile-stats-fix">.star-stat{margin-top:4px;font-size:13px;font-weight:700;color:#fff}.star-stat .star-mark{font-size:15px}.star-stat span:last-child{font-size:11px;font-weight:400;color:#d5e7df;margin-left:3px}@media(max-width:800px){.profile-strip .stat small{white-space:nowrap}.star-stat{font-size:12px}.star-stat span:last-child{font-size:10px}}</style>
<style id="league-ui-fix">

<style id="league-actions-fix">.league-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.btn.danger{border:1px solid #a52828;color:#a52828;background:#fff}.btn.danger:hover{background:#f8eeee}@media(max-width:800px){.league-actions{width:100%;justify-content:flex-start}.league-actions .btn{flex:1;min-width:0}}</style>

<style id="runner-news">

function starsInfoPage(){return `<div class="page info-page"><div class="page-head"><div><div class="eyebrow">Fantasyregler</div><h1>Så fungerar stjärnorna</h1><p class="page-intro">Stjärnorna är kostnaden för att välja en löpare.</p></div><button class="btn secondary" onclick="view='pick';render()">← Tillbaka</button></div><div class="card"><h2>Vad betyder stjärnorna?</h2><p>Varje löpare har ett fast antal stjärnor som fungerar som löparens pris i fantasy. Stjärnorna är alltså <strong>inte poäng</strong> som delas ut efter loppet.</p><h2>Din budget</h2><p>Du har totalt <strong>60 stjärnor</strong> att använda. När du väljer en löpare dras löparens stjärnkostnad från din budget. På sidan Välj löpare visas hur många stjärnor du har använt och hur många du har kvar.</p><h2>Hur många löpare får jag välja?</h2><p>Du får välja högst <strong>3 löpare i varje klass</strong>. Kostnaden för alla dina val måste tillsammans rymmas inom budgeten.</p><div class="info-note"><strong>Exempel:</strong> En löpare som kostar 8 stjärnor använder 8 av dina 60 stjärnor. En löpare som kostar 3 stjärnor använder 3.</div><h2>Hur sätts priset?</h2><p>Stjärnpriset är ett förutbestämt fantasyvärde för varje löpare och ändras inte automatiskt när loppet börjar. Det används för att skapa budgetbegränsningen och balansera vilka kombinationer av löpare som går att välja.</p></div></div>`}

    const an=(a.name||'').toLowerCase(), bn=(b.name||'').toLowerCase();
    const ac=(a.club||'').toLowerCase(), bc=(b.club||'').toLowerCase();
    const ab=Number(a.bib)||0, bb=Number(b.bib)||0;
    const as=Number(a.stars||1), bs=Number(b.stars||1);
    if(runnerSort==='nameDesc') return bn.localeCompare(an,'sv');
    if(runnerSort==='clubAsc') return ac.localeCompare(bc,'sv') || an.localeCompare(bn,'sv');
    if(runnerSort==='starsAsc') return as-bs || an.localeCompare(bn,'sv');
    if(runnerSort==='starsDesc') return bs-as || an.localeCompare(bn,'sv');
    if(runnerSort==='bibAsc') return ab-bb;
    return an.localeCompare(bn,'sv');
  });
  return list;
}
function filterRunnerRows(value){
  runnerSearch=value;
  const q=value.trim().toLowerCase();
  document.querySelectorAll('.runner-result').forEach(row=>{
    const hay=row.dataset.search||'';
    row.classList.toggle('is-hidden', !!q && !hay.includes(q));
  });
  const visible=document.querySelectorAll('.runner-result:not(.is-hidden)').length;
  const count=document.getElementById('runnerVisibleCount');
  if(count)count.textContent=`Visar ${visible} av ${document.querySelectorAll('.runner-result').length} löpare`;
}

function pickPage(){
  if(activeClass){
    const allRows = STARTLISTS.classes[activeClass] || [];
    const rows = filteredRunners(allRows);
    const picked = selectedRunners.filter(x=>x.classId===activeClass).length;
    const remaining = BUDGET-teamCost();

    return `<div class="page-head">
      <div>
        <div class="eyebrow">Startlista · ${activeClass}</div>
        <h1>${activeClass}</h1>
        <p class="page-intro">${allRows.length ? `${allRows.length} löpare i startlistan. Välj 3.` : 'Startlistan är inte inläst ännu.'}</p>
      </div>
      <button class="btn secondary" onclick="activeClass=null;runnerSearch='';render()">← Alla klasser</button>
    </div>

    <div class="runner-toolbar">
      <div class="runner-budget"><span class="star-mark">★</span> ${teamCost()} / ${BUDGET} stjärnor · ${remaining} kvar</div>
      <input
        class="runner-search"
        type="search"
        placeholder="Sök namn, klubb eller startnummer…"
        value="${runnerSearch.replace(/"/g,'&quot;')}"
        oninput="filterRunnerRows(this.value)"
      >
      <select class="runner-sort" onchange="runnerSort=this.value;render()">
        <option value="nameAsc" ${runnerSort==='nameAsc'?'selected':''}>Namn A–Ö</option>
        <option value="nameDesc" ${runnerSort==='nameDesc'?'selected':''}>Namn Ö–A</option>
        <option value="clubAsc" ${runnerSort==='clubAsc'?'selected':''}>Klubb A–Ö</option>
        <option value="starsAsc" ${runnerSort==='starsAsc'?'selected':''}>Stjärnor – lägst först</option>
        <option value="starsDesc" ${runnerSort==='starsDesc'?'selected':''}>Stjärnor – högst först</option>
        <option value="bibAsc" ${runnerSort==='bibAsc'?'selected':''}>Startnummer</option>
      </select>
      <div class="runner-count" id="runnerVisibleCount">Visar ${rows.length} av ${allRows.length} löpare</div>
    </div>

    <div class="card" style="padding:0">
      ${allRows.length ? (rows.length ? rows.map(r=>{
        const searchData=`${r.name||''} ${r.club||''} ${r.bib||''}`.toLowerCase().replace(/"/g,'&quot;');
        return `
        <div class="list-item runner-result runner-click" data-search="${searchData}" onclick='runnerInfo(${JSON.stringify(r)})'>
          <div class="mini-avatar">${initials(r.name)}</div>
          <div class="list-main">
            <div class="list-name">${r.name}</div>
            <div class="list-meta">${r.club || ''} · Startnr ${r.bib} · <strong><span class="star-mark">★</span> ${Number(r.stars||1)}</strong></div>
          </div>
          <button class="btn ${deadlinePassed()?'secondary':selected(activeClass,r.bib)?'primary':'secondary'}" ${deadlinePassed()?'disabled':''}
                  onclick='event.stopPropagation();toggleRunner(${JSON.stringify(activeClass)},${JSON.stringify(r)})'>
            ${deadlinePassed()?'Låst':selected(activeClass,r.bib)?'Vald':'Välj'}
          </button>
        </div>`;
      }).join('') : `<div class="empty">Ingen löpare matchar din sökning.</div>`) :
      `<div class="empty">
        Startlistan finns inte i <code>startlists.json</code> ännu.
        <br><br>
        När <code>startlists.js</code> eller <code>startlists.json</code> finns i samma projektmapp visas löparna här.
      </div>`}
    </div>`;
  }

  return `<div class="page-head">
    <div>
      <div class="eyebrow">Lidingöloppet Fantasy 2026</div>
      <h1>Välj löpare</h1>
      <p class="page-intro">Välj tre löpare i varje klass och bygg din fantasytrupp.</p><div class="selection-rules">
  <div class="budget-line"><span class="star-mark">★</span> ${teamCost()} / ${BUDGET} stjärnor</div>
  <div class="rules-line">Endast startgrupp 1A räknas i 15 km och 30 km.</div>
  <div class="rules-line deadline-line">${deadlinePassed()?'LAGET ÄR LÅST':'Deadline: '+deadlineText()}</div>
</div><div class="info-actions"><button class="btn secondary" onclick="view='stars';render()">Hur räknas stjärnorna?</button><button class="btn secondary" onclick="view='results';render()">Så räknas resultaten</button></div>
    </div>
  </div>
  <div class="grid classes">
    ${CLASSES.map(c=>`
      <button class="class-card" onclick='classPage(${JSON.stringify(c[0])})'>
        <div>
          <div class="class-name">${c[0]}</div>
          <div class="class-distance">${c[1]}</div>
        </div>
        <span class="arrow">›</span>
      </button>`).join('')}
  </div>
  ${runnerNewsSection()}
`;
}
function myPage(){let total=selectedRunners.length;return `<div class="page-head my-page-head"><div><div class="eyebrow">Din fantasytrupp</div><h1>Mina löpare</h1><p class="page-intro">Här får du en samlad överblick över dina val.</p></div></div><div class="my-runners-mobile-note">Tryck på en klass för att se dina val.</div><div class="profile-strip"><div class="profile-avatar">${profileData.avatar_url?`<img src="${profileData.avatar_url}" alt="">`:initials(current)}</div><div><h2>${current}</h2><p>Fantasytrupp 2026</p></div><div class="stat"><div class="big-number">${total} / 30</div><small>löpare valda</small><div class="star-stat"><span class="star-mark">★</span> ${teamCost()} / ${BUDGET} <span>stjärnor använda</span></div></div></div><div class="overview-grid">${CLASSES.map(c=>{const picks=selectedRunners.filter(r=>r.classId===c[0]);return `<section class="overview-card"><div class="overview-head"><strong>${c[0]}</strong><span>${picks.length} / 3 löpare</span></div><div class="overview-labels"><span>Löpare</span><span>Kostnad</span></div>${picks.length ? picks.map(r=>`<div class="runner-row runner-click" onclick='runnerInfo(${JSON.stringify(r)})'><div><div class="runner-name">${r.name}</div><div class="runner-club">${r.club||''}</div></div><div class="star-cost"><span class="star-mark">★</span><span class="star-cost-number">${Number(r.stars||1)}</span></div></div>`).join('') : `<div class="empty" style="padding:15px 0">Inga löpare valda ännu</div>`}</section>`}).join('')}</div>`}
function friendsPage(){let friends=db.friends.filter(x=>x!==current);return `<div class="page-head"><div><div class="eyebrow">Socialt</div><h1>Kompisar</h1><p class="page-intro">Lägg till kompisar och jämför era fantasytrupper.</p></div><button class="btn primary" onclick="friendModal()">+ Lägg till kompis</button></div><div class="friend-layout"><div class="list">${friends.length?friends.map(f=>`<div class="list-item"><div class="mini-avatar">${initials(f)}</div><div class="list-main"><div class="list-name">${f}</div><div class="list-meta">Kompis</div></div><button class="btn secondary" onclick="toast('Profil öppnad')">Visa</button></div>`).join(''):`<div class="empty">Du har inga kompisar ännu.<br>Skicka en inbjudan för att komma igång.</div>`}</div><div class="card"><h2 class="section-title" style="margin-top:0">Bjud in</h2><p class="page-intro">Skicka din inbjudningskod till en kompis.</p><div style="font-family:monospace;font-size:26px;color:var(--green);padding:16px 0">LL-${initials(current)}26</div><button class="btn primary" onclick="copyInvite()">Kopiera kod</button></div></div>`}
function leaguesPage(){
  const active=leaguesData.find(l=>l.id===activeLeagueId);
  return `<div class="page-head"><div><div class="eyebrow">Tävla tillsammans</div><h1>Ligor</h1><p class="page-intro">Skapa en liga, dela koden och tävla tillsammans. Poängen visas bredvid varje medlem.</p></div><button class="btn primary" onclick="leagueModal()">+ Skapa liga</button></div>
  ${active?leagueDetail(active):`
  <div class="league-layout"><div>${leaguesData.length?leaguesData.map(l=>`<div class="league-card"><div class="league-card-head"><div><h3>${escapeHtml(l.name)}</h3><div class="league-members">${l.members.length} medlem${l.members.length===1?'':'mar'} · Kod <strong>${l.code}</strong></div></div><span class="league-code">${l.owner_id===currentUser.id?'SKAPAD AV DIG':'MEDLEM'}</span></div><button class="btn secondary" onclick="openLeague('${l.id}')">Öppna liga</button></div>`).join(''):`<div class="card empty">Du är inte med i någon liga ännu.</div>`}</div>
  <div class="card"><h2 class="section-title" style="margin-top:0">Gå med i liga</h2><p class="page-intro">Skriv in koden du fått av en kompis.</p><div class="field" style="margin-top:18px"><label>Ligakod</label><input id="joinCode" maxlength="6" placeholder="t.ex. AB12CD"></div><button class="btn primary" onclick="joinLeague()">Gå med</button><div class="deadline-note">Deadline för lagändringar: <strong>25 september kl. 15:00</strong></div></div></div>`}
  `;
}
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function leagueDetail(l){return `<div class="league-detail"><div class="page-head"><div><div class="eyebrow">Liga</div><h2 class="league-detail-title">${escapeHtml(l.name)}</h2><p class="page-intro">Dela koden <strong>${l.code}</strong> så kan andra gå med.</p></div><div class="league-actions"><button class="btn secondary" onclick="activeLeagueId=null;activeLeagueMembers=[];render()">← Alla ligor</button>${l.owner_id===currentUser.id?`<button class="btn secondary" onclick="editLeagueModal('${l.id}')">Redigera</button><button class="btn danger" onclick="deleteLeague('${l.id}')">Radera liga</button>`:''}</div></div><div class="league-code-box"><span>Ligakod</span><strong>${l.code}</strong><button class="btn secondary" onclick="copyLeagueCode('${l.code}')">Kopiera kod</button></div><div class="card"><div class="league-table-head"><strong>Medlem</strong><strong>Poäng</strong></div>${activeLeagueMembers.map((m,i)=>`<div class="league-member-row"><div class="league-member-person"><div class="league-member-avatar">${m.avatar_url?`<img src="${escapeHtml(m.avatar_url)}" alt="">`:initials(m.display_name||m.username||'Användare')}</div><div class="league-member-info"><div class="list-name">${escapeHtml(m.display_name||m.username||'Användare')}</div>${m.username?`<div class="list-meta">@${escapeHtml(m.username)}</div>`:''}</div></div><strong class="league-points">${Number(m.points||0)>0?Number(m.points)+' p':'–'}</strong></div>`).join('')}</div></div>`}
async function loadLeagues(){if(!currentUser)return;const {data,error}=await supabaseClient.rpc('get_my_leagues');if(error){console.error('loadLeagues',error);toast('Kunde inte läsa ligorna: '+(error.message||'okänt fel'));leaguesData=[];return}const loaded=[];for(const l of (data||[])){const {data:members,error:memberError}=await supabaseClient.rpc('get_league_members',{p_league_id:l.id});if(memberError){console.error('get_league_members',l.id,memberError);loaded.push({...l,members:[],memberError:memberError.message||'Kunde inte läsa medlemmar'});continue}loaded.push({...l,members:members||[],memberError:null})}leaguesData=loaded;if(activeLeagueId){activeLeagueMembers=leaguesData.find(l=>l.id===activeLeagueId)?.members||[]}}
async function openLeague(id){activeLeagueId=id;await loadLeagues();activeLeagueMembers=leaguesData.find(l=>l.id===id)?.members||[];render()}
function editLeagueModal(id){const l=leaguesData.find(x=>x.id===id);if(!l)return;modal(`<h2>Redigera liga</h2><div class="field"><label>Ligans namn</label><input id="editLeagueName" maxlength="60" value="${escapeHtml(l.name)}"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="updateLeague('${id}')">Spara</button></div>`)}
async function updateLeague(id){const n=document.getElementById('editLeagueName')?.value.trim();if(!n){toast('Fyll i ett namn');return}const {error}=await supabaseClient.rpc('update_league',{p_league_id:id,p_name:n});if(error){toast('Kunde inte uppdatera ligan');return}closeModal();await loadLeagues();render();toast('Ligan uppdaterades')}
async function deleteLeague(id){const l=leaguesData.find(x=>x.id===id);if(!l)return;if(!confirm(`Radera ligan "${l.name}"? Detta tar bort ligan för alla medlemmar.`))return;const {error}=await supabaseClient.rpc('delete_league',{p_league_id:id});if(error){toast('Kunde inte radera ligan');return}if(activeLeagueId===id){activeLeagueId=null;activeLeagueMembers=[]}await loadLeagues();render();toast('Ligan raderades')}
function randomLeagueCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];return code}
function leagueModal(){modal(`<h2>Skapa liga</h2><div class="field"><label>Ligans namn</label><input id="leagueName" maxlength="60" placeholder="t.ex. Klassen 9B"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="createLeague()">Skapa liga</button></div>`)}
async function createLeague(){const n=document.getElementById('leagueName')?.value.trim();if(!n){toast('Fyll i ett namn');return}for(let i=0;i<5;i++){const code=randomLeagueCode();const {data,error}=await supabaseClient.rpc('create_league',{p_name:n,p_code:code});if(!error){closeModal();await loadLeagues();activeLeagueId=data[0].league_id;activeLeagueMembers=leaguesData.find(l=>l.id===activeLeagueId)?.members||[];render();toast('Liga skapad');return}}toast('Kunde inte skapa ligan just nu')}
async function joinLeague(){const code=document.getElementById('joinCode')?.value.trim().toUpperCase();if(!code){toast('Fyll i ligakoden');return}const {data:sessionData}=await supabaseClient.auth.getSession();if(!sessionData.session?.user){toast('Du måste vara inloggad för att gå med.');return}currentUser=sessionData.session.user;const {data,error}=await supabaseClient.rpc('join_league_by_code',{p_code:code});if(error){console.error('joinLeague',error);const msg=error.message||'';toast(msg.includes('DEADLINE_PASSED')?'Deadline har passerat.':msg.includes('LEAGUE_NOT_FOUND')?'Ligakoden hittades inte.':msg.includes('NOT_AUTHENTICATED')?'Inloggningen saknas. Logga in igen.':'Kunde inte gå med: '+msg);return}if(!data||!data.length||!data[0].league_id){console.error('joinLeague invalid response',data);toast('Ligan kunde inte öppnas efter anslutning.');return}await loadLeagues();activeLeagueId=data[0].league_id;activeLeagueMembers=leaguesData.find(l=>l.id===activeLeagueId)?.members||[];render();toast(data[0].already_member?'Du är redan med i ligan.':'Du gick med i ligan.')}
function copyLeagueCode(code){navigator.clipboard?.writeText(code);toast('Ligakoden kopierades')}
function modal(inner){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><div class="modal">${inner}</div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
supabaseClient.auth.getSession().then(async ({data})=>{currentUser=data.session?.user||null;if(currentUser){await loadUserData();await loadLeagues()}render();loadStartlists();});supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;});
</script>
