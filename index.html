<style>
@font-face{font-family:'Sofia Pro';src:url('./assets/fonts/Sofia%20Pro%20Regular.otf') format('opentype');font-style:normal;font-weight:400;font-display:swap}
:root{--green:#07583d;--green2:#0b6949;--mint:#4bb99b;--ink:#101513;--muted:#68736e;--line:#dfe6e2;--bg:#f3f5f3;--white:#fff;--red:#a52828;--font:'Sofia Pro',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}button,input{font:inherit}button{cursor:pointer}
.brand-font,h1,h2,h3,.nav,.class-name,.big-number,.btn,.logo-word{font-family:var(--font);letter-spacing:.01em}

.nav button{border:0;background:transparent;color:#dcebe5;padding:0 15px;height:100%;position:relative}.nav button.active,.nav button:hover{color:#fff}.nav button.active:after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:4px;background:var(--mint)}
.user-area{margin-left:auto;display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;min-width:38px;aspect-ratio:1/1;background:#fff;color:var(--green);display:grid;place-items:center;border-radius:50%;font-weight:700;overflow:hidden}.avatar img,.profile-avatar img{width:100%;height:100%;display:block;object-fit:cover}.profile-avatar{width:65px;height:65px;min-width:65px;aspect-ratio:1/1;background:#fff;color:var(--green);display:grid;place-items:center;font-size:25px;font-weight:700;border-radius:50%;overflow:hidden}.user-name{font-size:14px}.logout{border:1px solid #80a99b;background:transparent;color:#fff;padding:8px 12px}
.page{max-width:1180px;margin:0 auto;padding:36px 22px 70px}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--green2);font-family:var(--font);font-size:17px;text-transform:uppercase;font-weight:700;letter-spacing:.08em}.page h1{font-size:46px;line-height:1;margin:4px 0 0;font-weight:700}.page-intro{color:var(--muted);margin:8px 0 0;max-width:650px}.selection-rules{margin:14px 0 0;padding:13px 16px;border-left:5px solid var(--green);background:#e7eeea;color:var(--ink);font-size:16px;font-weight:600;line-height:1.4}.star-mark{color:var(--green);font-family:Arial,sans-serif;font-size:1em;font-weight:700;display:inline-block;line-height:1}
.btn{border:0;padding:11px 17px;font-size:18px;font-weight:600}.btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--green2)}.btn.secondary{background:#e7eeea;color:var(--green)}.btn.white{background:#fff;color:var(--green)}
.card{background:#fff;border:1px solid var(--line);padding:22px}.grid{display:grid;gap:14px}.grid.classes{grid-template-columns:repeat(2,minmax(0,1fr))}.class-card{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:20px 24px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--green)}.class-card>div{display:flex;flex-direction:column;align-items:flex-start}.class-card:hover{border-color:#aebdb6}.class-name{font-size:27px;font-weight:700;line-height:1.1}.class-distance{color:var(--muted);font-size:15px;line-height:1.25;margin-top:5px}.arrow{font-size:25px;color:var(--green)}
.login-wrap{min-height:100vh;background:linear-gradient(#f4f6f4,#eaf0ed);display:grid;place-items:center;padding:25px}.login-box{width:min(460px,100%);background:#fff;border:1px solid var(--line);padding:36px 36px 30px;box-shadow:0 14px 45px rgba(16,35,28,.09)}.login-logo{display:block;width:300px;max-width:90%;height:auto;margin:0 auto 28px}.login-title{font-family:var(--font);font-size:36px;text-align:center;margin:0 0 4px}.login-sub{text-align:center;color:var(--muted);margin:0 0 25px}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;border:1px solid #cfd8d3;padding:12px 13px;background:#fbfcfb;outline:none}.field input:focus{border-color:var(--green)}.login-actions{display:flex;gap:10px;margin-top:18px}.login-actions>*{flex:1}.login-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}.error{color:var(--red);font-size:13px;margin:8px 0}
.profile-strip{background:var(--green);color:#fff;padding:25px 27px;display:flex;align-items:center;gap:18px;margin-bottom:18px}.profile-avatar{width:65px;height:65px;background:#fff;color:var(--green);display:grid;place-items:center;font-size:25px;font-weight:700;border-radius:50%}.profile-strip h2{font-size:32px;margin:0}.profile-strip p{margin:2px 0 0;color:#d5e7df}.stat{margin-left:auto;text-align:right}.big-number{font-size:36px;font-weight:700}.stat small{color:#d5e7df}
.section-title{font-family:var(--font);font-size:30px;margin:28px 0 12px}.overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.overview-card{background:#fff;border:1px solid var(--line);padding:17px}.overview-head{display:flex;justify-content:space-between;border-bottom:1px solid #edf1ef;padding-bottom:9px;margin-bottom:5px}.overview-head strong{font-family:var(--font);font-size:21px;color:var(--green)}.overview-head span{color:var(--muted);font-size:13px;font-weight:600}.overview-labels{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:3px 0 2px}.overview-labels span:last-child{text-align:right}.runner-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f1}.runner-row:last-child{border:0}.runner-name{font-weight:600}.runner-club{font-size:12px;color:var(--muted);margin-top:2px}.stars{color:var(--green);font-weight:700;white-space:nowrap}.star-cost{display:flex;align-items:center;gap:4px;min-width:46px;justify-content:flex-end}.star-cost .star-mark{font-size:17px}.star-cost-number{font-size:14px;color:var(--green);font-weight:700}
.friend-layout,.league-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.list{background:#fff;border:1px solid var(--line)}.list-item{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid #edf0ee}.list-item:last-child{border:0}.mini-avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#dfeae5;color:var(--green);font-weight:700}.list-main{flex:1}.list-name{font-weight:700}.list-meta{font-size:12px;color:var(--muted);margin-top:2px}.right-actions{margin-left:auto}.empty{padding:28px;color:var(--muted);text-align:center}
.league-card{background:#fff;border:1px solid var(--line);padding:20px}.league-card + .league-card{margin-top:12px}.league-card-head{display:flex;justify-content:space-between;align-items:start}.league-card h3{font-size:28px;margin:0}.league-code{font-family:monospace;background:#edf3f0;color:var(--green);padding:5px 8px;font-size:12px}.league-members{color:var(--muted);font-size:13px;margin:7px 0 14px}.member-stack{display:flex;align-items:center}.member-stack .mini-avatar{margin-right:-8px;border:2px solid #fff;width:34px;height:34px;font-size:11px}.modal-backdrop{position:fixed;inset:0;background:rgba(7,24,17,.58);z-index:50;display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);background:#fff;padding:27px}.modal h2{font-size:34px;margin:0 0 17px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:13px 17px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.site-footer{margin-top:42px;padding:20px 0 4px;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:12px;text-align:center}
.site-footer button{border:0;background:none;color:var(--green);padding:0;text-decoration:underline;font-size:12px}
.terms-page{max-width:820px}.terms-page h2{font-size:25px;margin:28px 0 8px;color:var(--green)}.terms-page p{line-height:1.55;color:#39433f}.terms-page ul{line-height:1.55;color:#39433f;padding-left:22px}
@media(max-width:800px){.topbar{padding:0 14px;height:auto;min-height:64px;flex-wrap:wrap;gap:5px}.top-logo{height:40px}.nav{order:3;width:100%;height:45px;overflow:auto}.nav button{font-size:17px;padding:0 10px}.nav button.active:after{left:10px;right:10px}.user-name,.logout{display:none}.page{padding:25px 14px 50px}.page h1{font-size:39px}.page-head{align-items:start}.grid.classes,.overview-grid,.friend-layout,.league-layout{grid-template-columns:1fr}.profile-strip{align-items:flex-start}.stat{margin-left:auto}.big-number{font-size:30px}}
</style>

<body>
<div id="app"></div>
<script src="./startlists.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CLASSES=[
 ['P15','6 km · Lilla LL'],['F15','6 km · Lilla LL'],['P17','10 km'],['F17','10 km'],['P19','10 km'],['F19','10 km'],['M 15 km','15 km · 1A'],['K 15 km','15 km · 1A'],['M 30 km','30 km · 1A'],['K 30 km','30 km · 1A']
];
const BUDGET=60;
let STARTLISTS=window.LL_STARTLISTS||{updatedAt:null,classes:{}};
const SUPABASE_URL='https://ysrtvadqkvptzsvbpumt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_c458t1EQbKEcB18zeWj19Q_EHMfP0NZ';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let selectedRunners=[];
let activeClass=null;
let runnerSearch='';
let runnerSort='nameAsc';
async function loadStartlists(){
  if(window.LL_STARTLISTS){STARTLISTS=window.LL_STARTLISTS;if(current && view==='pick')render();return;}
  try{const r=await fetch('./startlists.json',{cache:'no-store'});if(!r.ok)throw new Error();STARTLISTS=await r.json();}
  catch(e){STARTLISTS={updatedAt:null,classes:{}};}
  if(current && view==='pick') render();
}
async function saveSelected(){if(!currentUser)return;const {error}=await supabaseClient.from('fantasy_teams').upsert({user_id:currentUser.id,selected_runners:selectedRunners,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)toast('Kunde inte spara laget');}
function teamCost(){return selectedRunners.reduce((sum,r)=>sum+Number(r.stars||1),0);}
function classPage(id){activeClass=id;render();}
function toggleRunner(id,runner){
  const idx=selectedRunners.findIndex(x=>x.classId===id&&x.bib===runner.bib);
  if(idx>=0) selectedRunners.splice(idx,1);
  else {
    if(selectedRunners.filter(x=>x.classId===id).length>=3){toast('Du kan bara välja 3 löpare i den här klassen');return;}
    const cost=Number(runner.stars||1);
    if(teamCost()+cost>BUDGET){toast(`Budgeten räcker inte — du har ${BUDGET-teamCost()} stjärnor kvar`);return;}
    selectedRunners.push({classId:id,...runner});
  }
  saveSelected();render();
}
function selected(id,bib){return selectedRunners.some(x=>x.classId===id&&x.bib===bib)}

let currentUser=null;
let current='';
let profileData={display_name:'',username:'',avatar_url:''};
let view='pick';
let db={friends:[],leagues:[{name:'Lidingö Fantasy 2026',code:'LL26',members:[],owner:''}]};
function initials(n){return (n||'').split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'?'}
function profilePage(){return `<div class="page-head"><div><div class="eyebrow">Ditt konto</div><h1>Profil</h1><p class="page-intro">Redigera dina uppgifter och din profilbild.</p></div><button class="btn secondary" onclick="view='pick';render()">← Tillbaka</button></div><div class="card" style="max-width:720px"><div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:26px"><div class="profile-avatar">${profileData.avatar_url?`<img src="${profileData.avatar_url}" alt="">`:initials(current)}</div><div><h2 style="margin:0 0 5px;font-size:30px">${current}</h2><div class="page-intro">${currentUser.email}</div></div><div style="margin-left:auto"><label class="btn secondary" style="display:inline-block">Byt profilbild<input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadAvatar(this.files[0])"></label></div></div><div class="field"><label>Visningsnamn</label><input id="profileDisplayName" value="${(profileData.display_name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></div><div class="field"><label>Användarnamn</label><input id="profileUsername" value="${(profileData.username||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" placeholder="t.ex. max123"></div><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn primary" onclick="saveProfile()">Spara ändringar</button></div></div>`}
async function saveProfile(){if(!currentUser)return;const displayName=document.getElementById('profileDisplayName').value.trim();const username=document.getElementById('profileUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(!displayName){toast('Fyll i ett visningsnamn');return}if(!username){toast('Fyll i ett användarnamn');return}const {error}=await supabaseClient.from('profiles').update({display_name:displayName,username,updated_at:new Date().toISOString()}).eq('id',currentUser.id);if(error){toast('Kunde inte spara uppgifterna');return}profileData.display_name=displayName;profileData.username=username;current=displayName;render();toast('Profilen sparades')}
async function uploadAvatar(file){if(!currentUser||!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Använd JPG, PNG eller WebP');return}if(file.size>5*1024*1024){toast('Bilden får vara högst 5 MB');return}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=currentUser.id+'/avatar.'+ext;const {error}=await supabaseClient.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'3600'});if(error){toast('Kunde inte ladda upp bilden');return}const {data}=supabaseClient.storage.from('avatars').getPublicUrl(path);const avatarUrl=data.publicUrl+'?v='+Date.now();const {error:updateError}=await supabaseClient.from('profiles').upsert({id:currentUser.id,display_name:profileData.display_name||current||currentUser.email.split('@')[0],username:profileData.username||null,avatar_url:avatarUrl,updated_at:new Date().toISOString()},{onConflict:'id'});if(updateError){toast('Bilden laddades upp men profilen kunde inte uppdateras');return}profileData.avatar_url=avatarUrl;render();toast('Profilbilden uppdaterades')}
function render(){document.getElementById('app').innerHTML=currentUser?appShell():loginPage()}
async function loadUserData(){
 if(!currentUser)return;
 const [{data:profile},{data:team}]=await Promise.all([
  supabaseClient.from('profiles').select('display_name,username,avatar_url').eq('id',currentUser.id).maybeSingle(),
  supabaseClient.from('fantasy_teams').select('selected_runners').eq('user_id',currentUser.id).maybeSingle()
 ]);
 profileData={display_name:profile?.display_name||currentUser.email.split('@')[0],username:profile?.username||'',avatar_url:profile?.avatar_url||''};
 current=profileData.display_name;
 selectedRunners=Array.isArray(team?.selected_runners)?team.selected_runners:[];
}
function loginPage(){return '<div class="login-wrap"><div class="login-box"><img class="login-logo" src="./assets/ll-logo.png" alt="TCS Lidingöloppet"><h1 class="login-title">Lidingöloppet Fantasy</h1><p class="login-sub">Bygg ditt lag. Tävla mot kompisarna.</p><div id="loginError"></div><div class="field"><label>E-post</label><input id="email" type="email" placeholder="du@exempel.se"></div><div class="field"><label>Lösenord</label><input id="password" type="password" placeholder="••••••••"></div><div class="login-actions"><button class="btn primary" onclick="login()">Logga in</button><button class="btn secondary" onclick="register()">Skapa konto</button></div><div class="login-note">Ditt konto sparas säkert och fungerar på alla dina enheter.</div></div></div>'}
async function login(){
 const e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;
 if(!e||!p){document.getElementById('loginError').innerHTML='<div class="error">Fyll i e-post och lösenord.</div>';return}
 const {data,error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});
 if(error){document.getElementById('loginError').innerHTML='<div class="error">Fel e-post eller lösenord.</div>';return}
 currentUser=data.user;await loadUserData();render();
}
async function register(){
 const e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;
 if(!e||!p){document.getElementById('loginError').innerHTML='<div class="error">Fyll i e-post och lösenord.</div>';return}
 if(p.length<6){document.getElementById('loginError').innerHTML='<div class="error">Lösenordet måste vara minst 6 tecken.</div>';return}
 const n=e.split('@')[0];
 const {data,error}=await supabaseClient.auth.signUp({email:e,password:p});
 if(error){document.getElementById('loginError').innerHTML='<div class="error">Kunde inte skapa kontot.</div>';return}
 if(data.user){
  await supabaseClient.from('profiles').upsert({id:data.user.id,display_name:n,updated_at:new Date().toISOString()},{onConflict:'id'});
  if(data.session){currentUser=data.user;current=n;selectedRunners=[];render();toast('Kontot skapades')}
  else document.getElementById('loginError').innerHTML='<div class="success">Kontot skapades. Kontrollera din e-post för att bekräfta kontot.</div>';
 }
}
async function logout(){await supabaseClient.auth.signOut();currentUser=null;current='';profileData={display_name:'',username:'',avatar_url:''};selectedRunners=[];render()}
function termsPage(){return `<div class="page terms-page"><div class="page-head"><div><div class="eyebrow">Information</div><h1>Villkor & information</h1><p class="page-intro">Viktig information om Lidingöloppet Fantasy.</p></div><button class="btn secondary" onclick="view='pick';render()">← Tillbaka</button></div><div class="card"><h2>Inofficiellt projekt</h2><p><strong>Lidingöloppet Fantasy är ett privat och inofficiellt hobbyprojekt.</strong> Tjänsten är inte skapad, driven, sponsrad, godkänd av eller på annat sätt officiellt kopplad till Lidingöloppet, TCS Lidingöloppet eller deras arrangörer.</p><p>Namnet Lidingöloppet och tillhörande varumärken, logotyper och annat material tillhör respektive rättighetsinnehavare. Lidingöloppets logotyp används här endast för att tydliggöra vilket lopp fantasyprojektet handlar om. Användningen innebär inte att någon officiell relation eller rekommendation finns.</p><h2>Startlistor och tävlingsuppgifter</h2><p>Uppgifter om löpare, startnummer, klubbar och tävlingsklasser används för att skapa fantasyfunktionen. Uppgifterna kan vara ofullständiga, ändras eller innehålla fel. För officiell och aktuell tävlingsinformation hänvisas användaren till Lidingöloppets egna kanaler.</p><h2>Fantasy och poäng</h2><p>Fantasytruppen, priser, poäng och andra spelregler är skapade för detta hobbyprojekt och är inte officiella regler för Lidingöloppet. Tjänsten har ingen koppling till tävlingens officiella resultat- eller anmälningssystem.</p><h2>Ansvar</h2><p>Tjänsten tillhandahålls som ett hobbyprojekt i befintligt skick. Vi lämnar inga garantier för att tjänsten, startlistor, priser, poäng eller annan information alltid är korrekt, komplett eller tillgänglig. Användaren ansvarar själv för hur informationen används.</p><h2>Ingen kommersiell koppling</h2><p>Projektet är inte avsett att ge intryck av att vara en officiell Lidingöloppet-produkt eller att företräda Lidingöloppet. Om en rättighetsinnehavare anser att något material bör ändras eller tas bort, kontakta projektets ansvariga så hanteras det skyndsamt.</p><h2>Kontakt</h2><p>Frågor om själva fantasyprojektet kan riktas till projektets ansvariga. Frågor om anmälan, startlistor, resultat eller tävlingen i övrigt bör riktas till Lidingöloppets officiella organisation.</p><h2>Senast uppdaterad</h2><p>23 september 2026.</p></div></div>`}

function siteFooter(){return `<footer class="site-footer"><span>Inofficiellt hobbyprojekt · Ej anslutet till Lidingöloppet</span><span>·</span><button onclick="view='terms';render()">Villkor & information</button></footer>`}

function appShell(){let u={name:current};return `<header class="topbar"><img class="top-logo" src="./assets/ll-logo.png" alt="Lidingöloppet"><nav class="nav"><button class="${view==='pick'?'active':''}" onclick="view='pick';render()">Välj löpare</button><button class="${view==='mine'?'active':''}" onclick="view='mine';render()">Mina löpare</button><button class="${view==='friends'?'active':''}" onclick="view='friends';render()">Kompisar</button><button class="${view==='leagues'?'active':''}" onclick="view='leagues';render()">Ligor</button></nav><div class="user-area"><button style="border:0;background:transparent;padding:0" onclick="view='profile';render()" title="Profil"><div class="avatar">${profileData.avatar_url?`<img src="${profileData.avatar_url}" alt="">`:initials(current)}</div></button><div class="user-name">${current}</div><button class="logout" onclick="logout()">Logga ut</button></div></header><main class="page">${view==='pick'?pickPage():view==='mine'?myPage():view==='friends'?friendsPage():view==='leagues'?leaguesPage():view==='terms'?termsPage():profilePage()}</main>${siteFooter()}`;}function filteredRunners(rows){
  const q=runnerSearch.trim().toLowerCase();
  let list=rows.filter(r=>{
    if(!q)return true;
    return `${r.name||''} ${r.club||''} ${r.bib||''}`.toLowerCase().includes(q);
  });
  list=[...list];
  list.sort((a,b)=>{
    const an=(a.name||'').toLowerCase(), bn=(b.name||'').toLowerCase();
    const ac=(a.club||'').toLowerCase(), bc=(b.club||'').toLowerCase();
    const ab=Number(a.bib)||0, bb=Number(b.bib)||0;
    const as=Number(a.stars||1), bs=Number(b.stars||1);
    if(runnerSort==='nameDesc') return bn.localeCompare(an,'sv');
    if(runnerSort==='clubAsc') return ac.localeCompare(bc,'sv') || an.localeCompare(bn,'sv');
    if(runnerSort==='starsAsc') return as-bs || an.localeCompare(bn,'sv');
    if(runnerSort==='starsDesc') return bs-as || an.localeCompare(bn,'sv');
    if(runnerSort==='bibAsc') return ab-bb;
    return an.localeCompare(bn,'sv');
  });
  return list;
}
function filterRunnerRows(value){
  runnerSearch=value;
  const q=value.trim().toLowerCase();
  document.querySelectorAll('.runner-result').forEach(row=>{
    const hay=row.dataset.search||'';
    row.classList.toggle('is-hidden', !!q && !hay.includes(q));
  });
  const visible=document.querySelectorAll('.runner-result:not(.is-hidden)').length;
  const count=document.getElementById('runnerVisibleCount');
  if(count)count.textContent=`Visar ${visible} av ${document.querySelectorAll('.runner-result').length} löpare`;
}

function pickPage(){
  if(activeClass){
    const allRows = STARTLISTS.classes[activeClass] || [];
    const rows = filteredRunners(allRows);
    const picked = selectedRunners.filter(x=>x.classId===activeClass).length;
    const remaining = BUDGET-teamCost();

    return `<div class="page-head">
      <div>
        <div class="eyebrow">Startlista · ${activeClass}</div>
        <h1>${activeClass}</h1>
        <p class="page-intro">${allRows.length ? `${allRows.length} löpare i startlistan. Välj 3.` : 'Startlistan är inte inläst ännu.'}</p>
      </div>
      <button class="btn secondary" onclick="activeClass=null;runnerSearch='';render()">← Alla klasser</button>
    </div>

    <div class="runner-toolbar">
      <div class="runner-budget"><span class="star-mark">★</span> ${teamCost()} / ${BUDGET} stjärnor · ${remaining} kvar</div>
      <input
        class="runner-search"
        type="search"
        placeholder="Sök namn, klubb eller startnummer…"
        value="${runnerSearch.replace(/"/g,'&quot;')}"
        oninput="filterRunnerRows(this.value)"
      >
      <select class="runner-sort" onchange="runnerSort=this.value;render()">
        <option value="nameAsc" ${runnerSort==='nameAsc'?'selected':''}>Namn A–Ö</option>
        <option value="nameDesc" ${runnerSort==='nameDesc'?'selected':''}>Namn Ö–A</option>
        <option value="clubAsc" ${runnerSort==='clubAsc'?'selected':''}>Klubb A–Ö</option>
        <option value="starsAsc" ${runnerSort==='starsAsc'?'selected':''}>Stjärnor – lägst först</option>
        <option value="starsDesc" ${runnerSort==='starsDesc'?'selected':''}>Stjärnor – högst först</option>
        <option value="bibAsc" ${runnerSort==='bibAsc'?'selected':''}>Startnummer</option>
      </select>
      <div class="runner-count" id="runnerVisibleCount">Visar ${rows.length} av ${allRows.length} löpare</div>
    </div>

    <div class="card" style="padding:0">
      ${allRows.length ? (rows.length ? rows.map(r=>{
        const searchData=`${r.name||''} ${r.club||''} ${r.bib||''}`.toLowerCase().replace(/"/g,'&quot;');
        return `
        <div class="list-item runner-result" data-search="${searchData}">
          <div class="mini-avatar">${initials(r.name)}</div>
          <div class="list-main">
            <div class="list-name">${r.name}</div>
            <div class="list-meta">${r.club || ''} · Startnr ${r.bib} · <strong>⭐ ${Number(r.stars||1)}</strong></div>
          </div>
          <button class="btn ${selected(activeClass,r.bib)?'primary':'secondary'}"
                  onclick='toggleRunner(${JSON.stringify(activeClass)},${JSON.stringify(r)})'>
            ${selected(activeClass,r.bib)?'Vald':'Välj'}
          </button>
        </div>`;
      }).join('') : `<div class="empty">Ingen löpare matchar din sökning.</div>`) :
      `<div class="empty">
        Startlistan finns inte i <code>startlists.json</code> ännu.
        <br><br>
        När <code>startlists.js</code> eller <code>startlists.json</code> finns i samma projektmapp visas löparna här.
      </div>`}
    </div>`;
  }

  return `<div class="page-head">
    <div>
      <div class="eyebrow">Lidingöloppet Fantasy 2026</div>
      <h1>Välj löpare</h1>
      <p class="page-intro">Välj tre löpare i varje klass och bygg din fantasytrupp.</p><div class="selection-rules">
  <div class="budget-line"><span class="star-mark">★</span> ${teamCost()} / ${BUDGET} stjärnor</div>
  <div class="rules-line">Endast startgrupp 1A räknas i 15 km och 30 km.</div>
</div>
    </div>
  </div>
  <div class="grid classes">
    ${CLASSES.map(c=>`
      <button class="class-card" onclick='classPage(${JSON.stringify(c[0])})'>
        <div>
          <div class="class-name">${c[0]}</div>
          <div class="class-distance">${c[1]}</div>
        </div>
        <span class="arrow">›</span>
      </button>`).join('')}
  </div>`;
}
function myPage(){let total=selectedRunners.length;return `<div class="page-head my-page-head"><div><div class="eyebrow">Din fantasytrupp</div><h1>Mina löpare</h1><p class="page-intro">Här får du en samlad överblick över dina val.</p></div></div><div class="my-runners-mobile-note">Tryck på en klass för att se dina val.</div><div class="profile-strip"><div class="profile-avatar">${profileData.avatar_url?`<img src="${profileData.avatar_url}" alt="">`:initials(current)}</div><div><h2>${current}</h2><p>Fantasytrupp 2026</p></div><div class="stat"><div class="big-number">${total} / 30</div><small>löpare valda · ${teamCost()} / ${BUDGET} <span class="star-mark">★</span></small></div></div><div class="overview-grid">${CLASSES.map(c=>{const picks=selectedRunners.filter(r=>r.classId===c[0]);return `<section class="overview-card"><div class="overview-head"><strong>${c[0]}</strong><span>${picks.length} / 3 löpare</span></div><div class="overview-labels"><span>Löpare</span><span>Kostnad</span></div>${picks.length ? picks.map(r=>`<div class="runner-row"><div><div class="runner-name">${r.name}</div><div class="runner-club">${r.club||''}</div></div><div class="star-cost"><span class="star-mark">★</span><span class="star-cost-number">${Number(r.stars||1)}</span></div></div>`).join('') : `<div class="empty" style="padding:15px 0">Inga löpare valda ännu</div>`}</section>`}).join('')}</div>`}
function friendsPage(){let friends=db.friends.filter(x=>x!==current);return `<div class="page-head"><div><div class="eyebrow">Socialt</div><h1>Kompisar</h1><p class="page-intro">Lägg till kompisar och jämför era fantasytrupper.</p></div><button class="btn primary" onclick="friendModal()">+ Lägg till kompis</button></div><div class="friend-layout"><div class="list">${friends.length?friends.map(f=>`<div class="list-item"><div class="mini-avatar">${initials(f)}</div><div class="list-main"><div class="list-name">${f}</div><div class="list-meta">Kompis</div></div><button class="btn secondary" onclick="toast('Profil öppnad')">Visa</button></div>`).join(''):`<div class="empty">Du har inga kompisar ännu.<br>Skicka en inbjudan för att komma igång.</div>`}</div><div class="card"><h2 class="section-title" style="margin-top:0">Bjud in</h2><p class="page-intro">Skicka din inbjudningskod till en kompis.</p><div style="font-family:monospace;font-size:26px;color:var(--green);padding:16px 0">LL-${initials(current)}26</div><button class="btn primary" onclick="copyInvite()">Kopiera kod</button></div></div>`}
function leaguesPage(){let ls=db.leagues.filter(l=>l.members.includes(current)||l.owner===current);return `<div class="page-head"><div><div class="eyebrow">Tävla tillsammans</div><h1>Ligor</h1><p class="page-intro">Skapa privata ligor, bjud in kompisar och följ tabellen tillsammans.</p></div><button class="btn primary" onclick="leagueModal()">+ Skapa liga</button></div><div class="league-layout"><div>${ls.length?ls.map(l=>`<div class="league-card"><div class="league-card-head"><div><h3>${l.name}</h3><div class="league-members">${l.members.length} medlem${l.members.length===1?'':'mar'} · Kod ${l.code}</div></div><span class="league-code">${l.owner===current?'ADMIN':'MEDLEM'}</span></div><div class="member-stack">${l.members.slice(0,6).map(m=>`<div class="mini-avatar" title="${m}">${initials(m)}</div>`).join('')}</div><div style="margin-top:16px"><button class="btn secondary" onclick="toast('Ligavyn kommer här')">Öppna liga</button></div></div>`).join(''):`<div class="card empty">Du är inte med i någon liga ännu.</div>`}</div><div class="card"><h2 class="section-title" style="margin-top:0">Gå med i liga</h2><p class="page-intro">Har en kompis skickat en ligakod?</p><div class="field" style="margin-top:18px"><label>Ligakod</label><input id="joinCode" placeholder="t.ex. LL26"></div><button class="btn primary" onclick="joinLeague()">Gå med</button></div></div>`}
function modal(inner){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><div class="modal">${inner}</div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function friendModal(){modal(`<h2>Lägg till kompis</h2><div class="field"><label>Kompisens användarnamn</label><input id="friendName" placeholder="t.ex. Erik"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="addFriend()">Lägg till</button></div>`)}
function addFriend(){let n=document.getElementById('friendName').value.trim();if(!n)return;if(!db.users.some(u=>u.name.toLowerCase()===n.toLowerCase())){toast('Ingen användare hittades');return}if(n===current||db.friends.includes(n)){toast('Redan tillagd');return}db.friends.push(n);save();closeModal();render();toast('Kompis tillagd')}
function leagueModal(){modal(`<h2>Skapa liga</h2><div class="field"><label>Ligans namn</label><input id="leagueName" placeholder="t.ex. Klassen 9B"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="createLeague()">Skapa liga</button></div>`)}
function createLeague(){let n=document.getElementById('leagueName').value.trim();if(!n)return;let code='LL'+Math.random().toString(36).slice(2,6).toUpperCase();db.leagues.push({name:n,code,members:[current],owner:current});save();closeModal();render();toast('Liga skapad')}
function joinLeague(){let code=document.getElementById('joinCode').value.trim().toUpperCase();let l=db.leagues.find(x=>x.code===code);if(!l){toast('Ligakoden hittades inte');return}if(!l.members.includes(current))l.members.push(current);save();render();toast('Du gick med i ligan')}
function copyInvite(){navigator.clipboard?.writeText('LL-'+initials(current)+'26');toast('Inbjudningskod kopierad')}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
supabaseClient.auth.getSession().then(async ({data})=>{currentUser=data.session?.user||null;if(currentUser){await loadUserData()}render();loadStartlists();});supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;});
</script>
