name: Uppdatera juniorhistorik (försiktigt)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-junior-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: JUNIOR_ONLY=1 node scripts/enrich-startlists.mjs
      - run: |
          git config user.name "Lidingöloppet Fantasy bot"
          git config user.email "actions@github.com"
          git add startlists.json startlists.js
          git diff --cached --quiet || git commit -m "Lägg till Lilla LL i juniorhistorik"
          git push
